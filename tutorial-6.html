<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="pl">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

<title>Tutorial 6 - Płatność na terminalu bez użycia wrappera kiosk.js</title>

<style>
    .hidden { display: none !important; }
</style>

</head>

<body>

    <script>
        const APIHOST = '';
        const PIN = '1111';   // Replace with actual PIN 
        var TOKEN = '';

        async function api(url, data) {
            const r = await fetch(url, {
                cache: "no-store",
                method: data ? 'POST' : 'GET',
                headers: {
                'Content-Type': 'application/json',
                ...(TOKEN ? {'Authorization': 'Bearer ' + TOKEN} : {})
                },
                body: data ? JSON.stringify(data) : null
            });
    
            // console.log("API response status:", r.status);
            const jsondata = await r.json();
            console.log(jsondata);
            console.log(JSON.stringify(jsondata));
            if (r.status !== 200 && r.status !== 201) {
                console.log("Nie można wykonać operacji. Poproś obsługę o pomoc.");
            }
            return jsondata;
        }

        async function getPaymentDetails(paymentId) {
            // Fetch payment details for the given payment UUID requires API in version 1.28+
            return await api(`${APIHOST}/api/transaction-payment/${paymentId}`);
        }

        async function doLogin(pin) {
            const response = await fetch(`${APIHOST}/api/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pin: pin })
            });

            const LOGIN_RESPONSE = await response.text();

            try {
                TOKEN = JSON.parse(LOGIN_RESPONSE).token;
            } catch (error) {
                TOKEN = null;
            }
            if (!TOKEN) {
                console.error('Login failed');
                console.error(LOGIN_RESPONSE);
            }
        }
        async function transactionStart(amount) {
            const startTransaction = document.getElementById('startTransaction');
            startTransaction.disabled = true;
            
            const resultTerminal = await api(
                `${APIHOST}/api/transaction-terminal`, 
                {
                    amount: Math.round(amount*100.0)
                }
              );
            console.log("Terminal response:", resultTerminal);
            console.log(JSON.stringify(resultTerminal));
            if( resultTerminal.ok ) {
                alert("Transakcja zakończona pomyślnie.");
                checkPaymentDetails(resultTerminal.paymentUUID);
            }else{
                alert("Transakcja nieautoryzowana, lub przerwano transakcję: " + resultTerminal.message);
            }
            startTransaction.disabled = false;
        }

        async function checkPaymentDetails(paymentUUID) {
            await doLogin(PIN);
            const resultPayment = await getPaymentDetails(paymentUUID);
            console.log("Payment response:", resultPayment);
        }
        
    </script>
    

    <button id="startTransaction" onclick="transactionStart(7.15)">Rozpocznij Transkacje na kwotę 7.15 PLN</button>

    
</body>
